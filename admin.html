
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login | Arjyapalli Connect</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f6f3ec;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 32px;
      border-radius: 16px;
      width: min(350px, 85vw);
      box-shadow: 0 8px 30px #0001;
    }
    h2 { color: #102c3b; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin: 9px 0;
      border-radius: 8px;
    }
    input { border: 1px solid #ccc; }
    button {
      background: #176b63;
      color: white;
      border: none;
      cursor: pointer;
    }
    #message { color: #b42318; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Arjyapalli Connect</h2>
    <p>Administrator Login</p>

    <form id="loginForm">
      <input id="email" type="email"
             placeholder="Admin email" required>
      <input id="password" type="password"
             placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <p id="message" role="status"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://yzaxzajpcmmgtaomwvhl.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_VJ8ePABV7Hpfqw8POlHtMQ_MO36Xm-0';
    const db = window.supabase.createClient(
      SUPABASE_URL, SUPABASE_KEY
    );

    document.getElementById('loginForm')
      .addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const message = document.getElementById('message');

        message.textContent = 'Signing in...';

        const { error } = await db.auth.signInWithPassword({
          email, password
        });

        if (error) {
          message.textContent = 'Login failed. Check your credentials.';
        } else {
          message.style.color = '#176b63';
          message.textContent = 'Login successful. Dashboard setup is next.';
        }
      });
  </script>
</body>
</html>
